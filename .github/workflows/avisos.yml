# Rumbo · Robot de avisos: corre gratis cada 15 minutos y manda los avisos push a los iPhone.
name: Avisos de Rumbo
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Mandar un aviso de prueba a todos los celulares'
        type: boolean
        default: false
concurrency:
  group: avisos
  cancel-in-progress: false  # si llega otra corrida mientras esta sigue, espera su turno
jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0 web-push@3.6.7
      - run: node robot-avisos.mjs
        env:
          TZ: America/Bogota
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PRUEBA: ${{ inputs.prueba && 'si' || '' }}
          VAPID_PUBLIC: BCVno__JGakkM1yGRPgeXgsyucIlhFGp5H09nT4Smsu52hnlYG0FHMXXo7jHKbNR482bG4apeT75f6D6IS4-Y3c
