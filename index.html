<div class="gate" id="gate">
  <div class="gate-fx" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="glass gate-card" id="gateCard">
    <div class="gate-brand" id="gateBrand" role="img" aria-label="Rumbo, de a dos pa' la casa"></div>
    <div class="gate-step gate-pick" id="gatePick">
      <h3 class="gp-q" id="gpQ">¿Quién entra?</h3>
      <div class="gp-list" role="group" aria-labelledby="gpQ">
        <button class="gp v" data-gp="V"><span class="gp-av"><b>V</b></span><span class="gp-n">Valentina</span><span class="gp-last">Última vez</span></button>
        <button class="gp d" data-gp="D"><span class="gp-av"><b>D</b></span><span class="gp-n">David</span><span class="gp-last">Última vez</span></button>
      </div>
    </div>
    <div class="gate-step gate-auth" id="gateAuth" hidden></div>
    <div class="gate-step gate-create" id="gateCreate" hidden></div>
    <div class="gate-step gate-login" id="gateLogin" hidden>
      <button class="face" id="faceBtn" aria-label="Entrar con Face ID">
        <svg class="rg" viewBox="0 0 108 108" aria-hidden="true"><circle class="tr" cx="54" cy="54" r="50"/><circle class="sc" id="scan" cx="54" cy="54" r="50"/></svg>
        <span class="fav" aria-hidden="true"><b id="faceIc">V</b></span>
        <svg class="tk" viewBox="0 0 44 44" id="faceTk" aria-hidden="true"><path d="m11 23 8 8 15-17"/></svg>
      </button>
      <h3 class="gl-hi" id="gateHi">Hola, Valentina</h3>
      <div class="face-l" id="faceL">Mira la pantalla para entrar</div>
      <button class="face-alt" id="gateBack">No soy yo · cambiar</button>
    </div>
    <div class="gate-step load" id="gateLoad" hidden>
      <div class="ldr" id="loadRing"></div>
      <div class="load-l" id="loadL" aria-live="polite">Trazando su rumbo</div>
      <div class="ldots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>
  </div>
</div>

<div class="isl" id="isl" role="status" aria-live="polite"></div>
<div class="cheer" id="cheer" hidden></div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet qa" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <h2 id="sheetTitle" class="sr">Agregar a la casa</h2>
    <div class="qa-h">
      <div class="seg2 qa-mode" role="group" aria-label="¿Qué quieren agregar?"><button type="button" data-mode="gasto" aria-pressed="true">Gasto</button><button type="button" data-mode="tarea" aria-pressed="false">Tarea</button></div>
      <button class="iconbtn sm" id="closeSheet" aria-label="Cerrar"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div id="qaGasto">
      <div class="display zero" id="display" aria-live="polite">$0</div>
      <div class="keys" id="keys"></div>
      <div class="qa-lbl"><span>Sugerencias</span><button type="button" class="qa-more" id="qaMore" aria-expanded="false">Ver todas</button></div>
      <div class="chips" id="chips"></div>
      <label class="sr" for="qaNote">¿En qué fue? (opcional)</label>
      <input id="qaNote" class="qa-note" maxlength="40" autocomplete="off" placeholder="¿En qué fue? (opcional)">
      <button class="btn acc qa-go" id="qaSave" type="button" disabled><svg class="i"><use href="#i-plus"/></svg>Crear gasto</button>
    </div>
    <form id="qaTarea" class="qa-task" autocomplete="off" hidden>
      <label class="qa-lbl" for="qaTx"><span>¿Qué hay que hacer?</span></label>
      <input id="qaTx" maxlength="80" placeholder="Ej.: Sacar la basura reciclable">
      <div class="qa-sug" id="qaSug"></div>
      <div class="qa-row">
        <div class="seg2" role="group" aria-label="¿Quién la hace?"><button type="button" data-tw="V" aria-pressed="true">Vale</button><button type="button" data-tw="D" aria-pressed="false">David</button></div>
        <div class="seg2" role="group" aria-label="Puntos"><button type="button" data-tp2="10" aria-pressed="false">+10</button><button type="button" data-tp2="15" aria-pressed="true">+15</button><button type="button" data-tp2="20" aria-pressed="false">+20</button></div>
      </div>
      <small class="warn" id="qaErr" role="alert"></small>
      <button class="btn acc qa-go" type="submit"><svg class="i"><use href="#i-plus"/></svg>Crear tarea</button>
    </form>
  </div>
</div>
<div class="scrim" id="scrimSet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="grab"></div>
    <div class="sheet-h"><h2 id="setTitle">Ajustes</h2><button class="btn ghost" id="closeSet">Cerrar</button></div>
    <div id="setBody"></div>
  </div>
</div>
<div class="avw" id="avw" hidden></div>
<div class="scrim" id="scrimTips" hidden>

    <div id="tipsBody"></div>
  </div>
</div>
